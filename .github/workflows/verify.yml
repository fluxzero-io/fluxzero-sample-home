name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Checkout pinned SDK candidate
        uses: actions/checkout@v5
        with:
          repository: fluxzero-io/fluxzero-sdk-java
          ref: 9ae3f349a2a94f9353e0e8419dd2ace299cc9fd7
          path: .sdk-source
      - name: Prepare local SDK candidate
        run: scripts/prepare-sdk.sh .sdk-source
      - run: ./mvnw -B verify
